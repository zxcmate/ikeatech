<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ikea I tech — биография, стек и проекты. Telegram: @oefod." />
  <title>ikea I tech — Биография</title>
  <link rel="icon" type="image/svg+xml" href="./assets/avatar.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Liquid Glass Ambient Background -->
  <div class="liquid-scene" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <div class="glass-mesh"></div>
  </div>

  <!-- Floating Glass Header -->
  <header class="site-header">
    <div class="container header-inner glass-bar">
      <a href="#top" class="brand" aria-label="ikea I tech home">
        <span class="brand-mark" aria-hidden="true">I|T</span>
        <span class="brand-name" id="brand-handle">ikea I tech</span>
      </a>

      <nav class="nav-links" id="nav-links" aria-label="Навигация">
        <a href="#about" data-nav="about">О себе</a>
        <a href="#services" data-nav="services">Услуги</a>
        <a href="#contact" data-nav="contact">Telegram</a>
      </nav>

      <div class="header-controls">
        <button type="button" class="pill-btn" id="lang-toggle" aria-label="Переключить язык">
          <span class="mono">RU</span> / EN
        </button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Переключить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-label="Открыть меню" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero section">
      <div class="container hero-grid">
        <div class="hero-content reveal">
          <a href="https://t.me/oefod" target="_blank" rel="noopener noreferrer" class="status-pill glass-pill">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="hero-badge" class="animated-gradient-text"></span>
          </a>

          <h1 class="hero-title animated-gradient-text" id="hero-title">ikea I tech</h1>
          <p class="hero-subtitle" id="hero-subtitle"></p>
          <p class="hero-description" id="hero-description"></p>

          <div class="hero-actions">
            <a
              href="https://t.me/oefod"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-primary"
              id="hero-primary-cta"
            ></a>
            <a href="#services" class="btn btn-glass" id="hero-secondary-cta"></a>
          </div>
        </div>

        <aside class="glass-card profile-card reveal" aria-label="Карточка профиля">
          <div class="avatar-frame">
            <img id="hero-avatar" src="./assets/avatar.jpg" alt="Аватар ikea I tech" width="230" height="230" />
          </div>
          <dl class="spec-list" id="hero-spec-list"></dl>
        </aside>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow mono" id="about-eyebrow"></span>
          <h2 class="section-title" id="about-heading"></h2>
        </div>

        <div class="bento-grid" id="about-cards"></div>
      </div>
    </section>

    <!-- Services -->
    <section id="services" class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow mono" id="services-eyebrow"></span>
          <h2 class="section-title" id="services-heading"></h2>
        </div>

        <div class="bento-grid bento-grid-2" id="services-cards"></div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section">
      <div class="container">
        <div class="glass-card contact-panel reveal">
          <div class="contact-main">
            <span class="eyebrow mono" id="contact-eyebrow"></span>
            <h2 class="section-title" id="contact-heading"></h2>
            <p class="contact-text" id="contact-text"></p>
          </div>

          <div class="contact-actions">
            <a
              href="https://t.me/oefod"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-primary"
              id="open-tg-btn"
            ></a>
            <button type="button" class="btn btn-glass" id="copy-tg-btn"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="mono" id="footer-note"></p>
      <a href="#top" class="back-to-top mono" id="back-to-top"></a>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast glass-card" id="toast" role="status" aria-live="polite"></div>

  <script src="./profile.js"></script>
  <script src="./app.js"></script>
</body>
</html>
